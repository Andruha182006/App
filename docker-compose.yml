version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: